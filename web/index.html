<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>itposao — dev viewer</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  li { margin-bottom: 0.75rem; }
  .company { color: #666; }
  #controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  #search { flex: 1; padding: 0.4rem; }
  #companyFilter { padding: 0.4rem; }
</style>
</head>
<body>
<h1>itposao jobs (dev viewer)</h1>
<div id="controls">
  <input id="search" type="search" placeholder="Search title or location…">
  <select id="companyFilter"><option value="">All companies</option></select>
  <select id="locationFilter"><option value="">All locations</option></select>
</div>
<ul id="jobs">Loading…</ul>

<script>
let jobs = [];
let companyTitle = {};

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const companyID = document.getElementById('companyFilter').value;
  const location = document.getElementById('locationFilter').value;

  const filtered = jobs.filter(j => {
    if (companyID && String(j.CompanyID) !== companyID) return false;
    if (location && !j.Location.includes(location)) return false;
    if (!q) return true;
    const haystack = `${j.Title} ${j.Location} ${companyTitle[j.CompanyID] ?? ''}`.toLowerCase();
    return haystack.includes(q);
  });

  const list = document.getElementById('jobs');
  list.innerHTML = '';
  for (const j of filtered) {
    const li = document.createElement('li');
    li.innerHTML = `<a href="${j.URL}" target="_blank">${j.Title}</a> <span class="company">— ${companyTitle[j.CompanyID] ?? 'unknown'} (${j.Location})</span>`;
    list.appendChild(li);
  }
  if (filtered.length === 0) list.textContent = 'No jobs found.';
}

async function load() {
  const [jobsRes, companies] = await Promise.all([
    fetch('/v1/jobs').then(r => r.json()),
    fetch('/v1/companies').then(r => r.json()),
  ]);
  jobs = jobsRes || [];
  companyTitle = Object.fromEntries((companies || []).map(c => [c.ID, c.Title]));

  const select = document.getElementById('companyFilter');
  for (const c of companies || []) {
    const opt = document.createElement('option');
    opt.value = c.ID;
    opt.textContent = c.Title;
    select.appendChild(opt);
  }

  // Location strings are messy comma-joined lists (e.g. HTEC's "Bosnia and
  // Herzegovina, North Macedonia, ..."), so split into individual places
  // for the dropdown and filter by substring match against the raw field.
  const places = new Set();
  for (const j of jobs) {
    for (const p of j.Location.split(',')) {
      const trimmed = p.trim();
      if (trimmed) places.add(trimmed);
    }
  }
  const locationSelect = document.getElementById('locationFilter');
  for (const p of [...places].sort()) {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    locationSelect.appendChild(opt);
  }

  document.getElementById('search').addEventListener('input', render);
  select.addEventListener('change', render);
  locationSelect.addEventListener('change', render);
  render();
}
load();
</script>
</body>
</html>
